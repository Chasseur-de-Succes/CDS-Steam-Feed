version: '3'

services:
  feed:
    build: .
    restart: always
    networks:
      - bdd
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: cds_user
      POSTGRES_PASSWORD: cds_pwd
      POSTGRES_DB: cds_db
    volumes:
      - /opt/cds:/var/lib/postgresql/data
    networks:
      - bdd

networks:
  bdd:
    driver: bridge
